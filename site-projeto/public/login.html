<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save Room</title>
    <link rel="stylesheet" href="styleLogin.css">
    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap">
</head>

<body>
    <header>
        <img src="assets/logo.png" alt="Logo Save Room" id="logoSR">
        <nav>
            <a href="index.html" class="navLink">HOME</a>
            <a href="index.html#sobreMim" class="navLink">SOBRE</a>
            <a href="conexoes.html" class="navLink">CONEXÕES</a>
            <a href="#" class="navLink">SEU TIPO</a>
            <a href="#" class="navLink">FERRAMENTAS</a>
        </nav>
    </header>
    <main>
        <section id="login">
            <div id="img" role="img" aria-label="Ilustração do Save Room"></div>

            <div id="form">
                <div class="abas">
    <a href="login.html" class="aba ativa">LOGIN</a>
    <a href="cadastro.html" class="aba">CADASTRO</a>
</div>
                <h1>Login</h1>
                <p>Seja bem-vindo novamente! Faça login para acessar sua conta.</p>

                <form>
                    <div class="campo">
                        <span class="material-symbols-outlined">person</span>
                        <input type="email" name="mail" id="imail" placeholder="Seu e-mail" autocomplete="email"
                            required maxlength="30">
                    </div>

                    <div class="campo">
                        <span class="material-symbols-outlined">vpn_key</span>
                        <input type="password" name="senha" id="isenha" placeholder="Sua senha"
                            autocomplete="current-password" required minlength="8" maxlength="20">
                        <button type="button" onclick="verSenha()" id="botaoVerSenha"
                            aria-label="Mostrar ou ocultar a senha">VER</button>
                    </div>

                    <button type="button" onclick="entrar()" id="entrar">Entrar</button>
                </form>
            </div>
        </section>
    </main>
    <footer>
        <p>Site criado por <a href="https://github.com/casarinigreg" target="_blank">Gregory Casarini</a></p>
    </footer>
</body>
</html>
<script>
    function verSenha() {
    if (isenha.type == 'password') {
        isenha.type = 'text';
        btn_ver.innerHTML = 'OCULTAR';
    } else {
        isenha.type = 'password';
        btn_ver.innerHTML = 'VER';
    }
}

function entrar() {
    var emailVar = imail.value;
    var senhaVar = isenha.value;

    if(!(emailVar.includes('@') && emailVar.includes('.com'))) {
        mostrarPopup('o e-mail deve conter \'@\' e \'.com\'!');
        return false;
    }

    if (emailVar == "" || senhaVar == "") {
        mostrarPopup('Todos os campos precisam estar preenchidos!');
        return false;
    }

    console.log("FORM LOGIN: ", emailVar);
    console.log("FORM SENHA: ", senhaVar);


    fetch("/usuarios/autenticar", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            emailServer: emailVar,
            senhaServer: senhaVar,
        })
    }).then(function (resposta) {

        if (resposta.ok) {
            console.log(resposta);

            resposta.json().then(json => {
                console.log(json);
                console.log(JSON.stringify(json));
                sessionStorage.EMAIL_USUARIO = json.email;
                sessionStorage.NOME_CLIENTE = json.nome;

                setTimeout(function () {
                    window.location = "./seuTipo.html";
                }, 1000); // apenas para exibir o loading

            });

        } else {
            mostrarPopup("Houve um erro ao tentar realizar o login!")

            resposta.text().then(texto => {
                console.error(texto);
            });
        }

    }).catch(function (erro) {
        console.log(erro);
    })

    return false;
}
</script>
