<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save Room</title>
    <link rel="stylesheet" href="styleCadastro.css">
    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap">
</head>

<body>
    <header>
        <img src="assets/logo.png" alt="Logo Save Room" id="logoSR">
        <nav>
            <a href="index.html" class="navLink">HOME</a>
            <a href="index.html#sobreMim" class="navLink">SOBRE</a>
            <a href="conexoes.html" class="navLink">CONEXÕES</a>
            <a href="#" class="navLink">FERRAMENTAS</a>
        </nav>
    </header>
    <main>
        <section id="login">
            <div id="img" role="img" aria-label="Ilustração do Save Room"></div>

            <div id="form">
                <div class="abas">
    <a href="login.html" class="aba">LOGIN</a>
    <a href="cadastro.html" class="aba ativa">CADASTRO</a>
</div>
                <h1>Cadastro</h1>
                <p>Crie sua conta e comece a usar as ferramentas do Save Room.</p>

                <form>
                    <div class="campo">
                        <span class="material-symbols-outlined">person</span>
                        <input type="text" name="nickname" id="icliente" placeholder="Seu nickname"
                            autocomplete="nickname" required minlength="3" maxlength="20">
                        </div>
                        <div class="login-msg" id="div_result_cliente"></div>

                    <div class="campo">
                        <span class="material-symbols-outlined">mail</span>
                        <input type="email" name="mail" id="imail" placeholder="Seu e-mail" autocomplete="email"
                            required maxlength="30">
                        </div>
                        <div class="login-msg" id="div_result_mail"></div>

                    <div class="campo">

                        <span class="material-symbols-outlined">vpn_key</span>

                        <input type="password" name="senha" id="isenha" placeholder="Sua senha"
                            autocomplete="new-password" required minlength="8" maxlength="20">

                        <button type="button" onclick="verSenha()" id="botaoVerSenha"
                            aria-label="Mostrar ou ocultar a senha">VER</button>

                    </div>
                    <div class="login-msg" id="div_result_senha"></div>

                    <div class="campo">
                        <span class="material-symbols-outlined">lock</span>

                        <input type="password" name="confirmarSenha" id="iconfirmacao" placeholder="Confirme sua senha"
                            autocomplete="new-password" required minlength="8" maxlength="20">

                        <button type="button" onclick="verSenha2()" id="botaoVerConfirmar"
                            aria-label="Mostrar ou ocultar a confirmação da senha">VER</button>

                            
                        </div>
                        <div class="login-msg" id="div_result_confirmacao_senha"></div>

                    <button type="button" onclick="registrar()" id="entrar">Cadastrar</button>

                </form>
            </div>
        </section>
    </main>
    <footer>
        <p>Site criado por <a href="https://github.com/casarinigreg" target="_blank">Gregory Casarini</a></p>
    </footer>
</body>

</html>
<script>
    function registrar() {
    let cliente = icliente.value;
    let email = imail.value;
    let flagError = false;



    if (cliente.trim() == '') {
        div_result_cliente.innerHTML = `Informe o seu nickname`;
        flagError = true;
    } else {
        div_result_cliente.innerHTML = ``;
    }

    if (email.includes('@') && email.includes('.com')) {
        div_result_mail.innerHTML = ``;
    } else {
        div_result_mail.innerHTML = `E-mail deve conter @ e .com`;
        flagError = true;
    }


    // VALIDAÇÃO DA SENHA
    let senha = isenha.value;
    let tamanhoSenha = senha.length;
    let temMaiuscula = senha !== senha.toUpperCase();
    let temMinuscula = senha !== senha.toLowerCase();
    let validacaoSenha = iconfirmacao.value;

    let contador = 0;
    let contSimbolos = 0;
    let simbolos = '!@#$%&*()_+-=[]{};:,.<>?/|~';

    while (contador < senha.length) {
        if (simbolos.includes(senha[contador])) {
            contSimbolos++;
        }
        contador++;
    }

    if (tamanhoSenha == 0) {
        div_result_senha.innerHTML = `Informe uma senha`;
        flagError = true;
    } else if (tamanhoSenha < 8) {
        div_result_senha.innerHTML = `A senha deve ter pelo menos 8 caracteres`;
        flagError = true;
    } else if (!temMaiuscula) {
        div_result_senha.innerHTML = `A senha deve conter pelo menos uma letra maiúscula`;
        flagError = true;
    } else if (!temMinuscula) {
        div_result_senha.innerHTML = `A senha deve conter pelo menos uma letra minúscula`;
        flagError = true;
    } else if (contSimbolos == 0) {
        div_result_senha.innerHTML = `A senha deve conter pelo menos um caractere especial`;
        flagError = true;
    } else {
        div_result_senha.innerHTML = ``;
    }

    // VALIDAÇÃO DA CONFIRMAÇÃO DA SENHA
    if (validacaoSenha == '') {
        div_result_confirmacao_senha.innerHTML = `Confirme sua senha`;
        flagError = true;
    } else if (senha != validacaoSenha) {
        div_result_confirmacao_senha.innerHTML = `As senhas não conferem`;
        flagError = true;
    } else {
        div_result_confirmacao_senha.innerHTML = ``;
    }

    if (flagError) {
        return;
    }

    cadastrar();
}


    function verSenha() {
        if (isenha.type == 'password') {
            isenha.type = 'text';
            btn_ver.innerHTML = 'OCULTAR';
        } else {
            isenha.type = 'password';
            btn_ver.innerHTML = 'VER';
        }

    }

    function verSenha2() {
        if (iconfirmar.type == 'password') {
            iconfirmar.type = 'text';
            btn_ver.innerHTML = 'OCULTAR';
        } else {
            iconfirmar.type = 'password';
            btn_ver.innerHTML = 'VER';
        }
    }

}
</script>
